<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Produits</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap');

        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --card: #1c1c28;
            --border: #2a2a3d;
            --accent: #e94560;
            --accent2: #7c3aed;
            --text: #f0f0f5;
            --muted: #6b6b80;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: var(--text);
        }

        .logo span {
            color: var(--accent);
        }

        .btn-ajouter {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ajouter:hover {
            background: #c73652;
            transform: translateY(-1px);
        }

        /* ── Main ── */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 28px;
            flex: 1;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-top: 6px;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ── Grille produits ── */
        .grille {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .produit-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .produit-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .produit-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--surface);
        }

        .produit-img-placeholder {
            width: 100%;
            height: 180px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .produit-body {
            padding: 16px;
        }

        .produit-nom {
            font-family: 'Syne', sans-serif;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .produit-detail {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .produit-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .produit-prix {
            color: var(--accent);
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        .produit-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-icon.delete:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* ── Empty state ── */
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty h3 {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            color: var(--text);
            margin-bottom: 8px;
        }

        /* ── Modal ── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .modal-title {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 22px;
            cursor: pointer;
        }

        .btn-close:hover {
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        textarea.form-input {
            height: 100px;
            resize: vertical;
        }

        /* Zone image */
        .image-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            position: relative;
        }

        .image-zone:hover {
            border-color: var(--accent);
        }

        .image-zone input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .image-zone-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .image-zone-text {
            color: var(--muted);
            font-size: 13px;
        }

        .image-preview {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #c73652;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: #fff;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 999;
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Nabou<span> GP</span></div>
        <button class="btn-ajouter" onclick="ouvrirModal()">+ Ajouter un produit</button>
    </header>

    <main>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Produits</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Prix Moyen</div>
                <div class="stat-value" id="stat-moyen">0 F</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Valeur Stock</div>
                <div class="stat-value" id="stat-valeur">0 F</div>
            </div>
        </div>

        <div class="section-title">Catalogue</div>
        <div class="grille" id="grille"></div>
    </main>

    <!-- Modal Formulaire -->
    <div class="overlay" id="overlay" onclick="fermerModalOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-titre">Nouveau Produit</div>
                <button class="btn-close" onclick="fermerModal()">✕</button>
            </div>

            <div class="form-group">
                <label class="form-label">Nom du produit *</label>
                <input type="text" class="form-input" id="input-nom" placeholder="Ex: Chemise en coton" />
            </div>

            <div class="form-group">
                <label class="form-label">Prix (FCFA) *</label>
                <input type="number" class="form-input" id="input-prix" placeholder="Ex: 15000" min="0" />
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input" id="input-detail" placeholder="Décrivez votre produit..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Image</label>
                <div class="image-zone" id="image-zone">
                    <input type="file" id="input-image" accept="image/*" onchange="previewImage(event)" />
                    <div class="image-zone-icon">📷</div>
                    <div class="image-zone-text">Cliquez pour choisir une image</div>
                    <img class="image-preview" id="image-preview" />
                </div>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="sauvegarder()">
                ✅ Enregistrer le produit
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'https://api-produits.onrender.com';
        let produits = [];
        let editId = null;

        // ── Chargement ──────────────────────────────────────────────
        async function charger() {
            try {
                const res = await fetch(`${API}/produits`);
                produits = await res.json();
                afficher();
                majStats();
            } catch {
                toast('Impossible de contacter le serveur', true);
            }
        }

        // ── Affichage grille ────────────────────────────────────────
        function afficher() {
            const grille = document.getElementById('grille');
            if (produits.length === 0) {
                grille.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <div class="empty-icon">📭</div>
          <h3>Aucun produit</h3>
          <p>Cliquez sur "+ Ajouter un produit" pour commencer</p>
        </div>`;
                return;
            }
            grille.innerHTML = produits.map(p => `
      <div class="produit-card">
        ${p.image_url
                    ? `<img class="produit-img" src="${p.image_url}" alt="${p.nom}" />`
                    : `<div class="produit-img-placeholder">📦</div>`}
        <div class="produit-body">
          <div class="produit-nom">${p.nom}</div>
          <div class="produit-detail">${p.detail || 'Aucune description'}</div>
          <div class="produit-footer">
            <div class="produit-prix">${Number(p.prix).toLocaleString('fr-FR')} F</div>
            <div class="produit-actions">
              <button class="btn-icon" onclick="editer(${p.id})" title="Modifier">✏️</button>
              <button class="btn-icon delete" onclick="supprimer(${p.id})" title="Supprimer">🗑️</button>
            </div>
          </div>
        </div>
      </div>`).join('');
        }

        // ── Stats ───────────────────────────────────────────────────
        function majStats() {
            const total = produits.length;
            const moyen = total ? Math.round(produits.reduce((s, p) => s + p.prix, 0) / total) : 0;
            const valeur = produits.reduce((s, p) => s + p.prix, 0);
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-moyen').textContent = moyen.toLocaleString('fr-FR') + ' F';
            document.getElementById('stat-valeur').textContent = valeur.toLocaleString('fr-FR') + ' F';
        }

        // ── Modal ───────────────────────────────────────────────────
        function ouvrirModal(p = null) {
            editId = p ? p.id : null;
            document.getElementById('modal-titre').textContent = p ? '✏️ Modifier le produit' : 'Nouveau Produit';
            document.getElementById('input-nom').value = p ? p.nom : '';
            document.getElementById('input-prix').value = p ? p.prix : '';
            document.getElementById('input-detail').value = p ? p.detail : '';
            document.getElementById('input-image').value = '';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('btn-submit').textContent = p ? '💾 Enregistrer les modifications' : '✅ Enregistrer le produit';
            document.getElementById('overlay').classList.add('active');
        }

        function fermerModal() {
            document.getElementById('overlay').classList.remove('active');
        }

        function fermerModalOverlay(e) {
            if (e.target === document.getElementById('overlay')) fermerModal();
        }

        // ── Preview image ───────────────────────────────────────────
        function previewImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const preview = document.getElementById('image-preview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        }

        // ── Sauvegarder ─────────────────────────────────────────────
        async function sauvegarder() {
            const nom = document.getElementById('input-nom').value.trim();
            const prix = document.getElementById('input-prix').value.trim();
            const detail = document.getElementById('input-detail').value.trim();
            const imageFile = document.getElementById('input-image').files[0];

            if (!nom) return toast('Le nom est obligatoire', true);
            if (!prix || isNaN(prix)) return toast('Entrez un prix valide', true);

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = '⏳ Enregistrement...';

            const formData = new FormData();
            formData.append('nom', nom);
            formData.append('prix', prix);
            formData.append('detail', detail);
            if (imageFile) formData.append('image', imageFile);

            try {
                const url = editId ? `${API}/produits/${editId}` : `${API}/produits`;
                const method = editId ? 'PUT' : 'POST';
                const res = await fetch(url, { method, body: formData });
                if (!res.ok) throw new Error();
                fermerModal();
                await charger();
                toast(editId ? 'Produit modifié ✅' : 'Produit ajouté ✅');
            } catch {
                toast('Une erreur est survenue', true);
            } finally {
                btn.disabled = false;
                btn.textContent = editId ? '💾 Enregistrer les modifications' : '✅ Enregistrer le produit';
            }
        }

        // ── Editer ──────────────────────────────────────────────────
        function editer(id) {
            const p = produits.find(p => p.id === id);
            if (p) ouvrirModal(p);
        }

        // ── Supprimer ───────────────────────────────────────────────
        async function supprimer(id) {
            if (!confirm('Supprimer ce produit ?')) return;
            try {
                await fetch(`${API}/produits/${id}`, { method: 'DELETE' });
                await charger();
                toast('Produit supprimé');
            } catch {
                toast('Erreur lors de la suppression', true);
            }
        }

        // ── Toast notification ──────────────────────────────────────
        function toast(msg, erreur = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (erreur ? ' error' : '') + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Démarrage
        charger();
    </script>
</body>

</html>
